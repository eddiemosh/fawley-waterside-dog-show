server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets correctly
    location /static/ {
        try_files $uri =404;
    }

    # Main route handler for SPA
    location / {
        try_files $uri /index.html;
    }

    # Optional: prevent incorrect MIME types by setting proper types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optional: serve 404s with index.html to handle client-side routes gracefully
    error_page 404 /index.html;
}
